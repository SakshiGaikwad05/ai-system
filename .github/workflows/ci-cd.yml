name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -v

  deploy-staging:
    name: Deploy to Staging
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test — app.py
        run: python app.py

      - name: Smoke test — debugging demo normal
        run: python -m debugging.demo normal

      - name: Package project artifact
        run: |
          mkdir -p staging-artifact
          cp -r \
            app.py \
            src/ \
            debugging/ \
            tests/ \
            benchmarks/ \
            requirements.txt \
            .env.example \
            staging-artifact/
          cd staging-artifact && find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-${{ github.sha }}
          path: staging-artifact/
